    <center>

    <form>
        <fieldset>
            <legend><strong>Contact Us</strong></legend>
            <label>Name:</label>
            <input type="text">
            <br><br>

            <label>Email:</label>
            <input type="email">
            <br><br>

            <label>Phone:</label>
            <input type="tel">
            <br><br>

            <label>Subject:</label>
            <input type="text">
            <br><br>

            <label>Message:</label>
            <textarea placeholder="Write Your Message" rows="5"></textarea>
            <br><br>

            <label>Gender:</label>
            <input type="radio" name="Gender">Male
            <input type="radio" name="Gender">Female

            <br><br>

            <label>Feedback:</label>
            <textarea placeholder="Give Your Feedback"></textarea>
            <br><br>

            <label>Food Preference:</label>
            <select>
                <option disabled selected>Food Preference</option>
                <option>PIZZA</option>
                <option>BURGER</option>
                <option>ZINGER BURGER</option>
                <option>APPETIZERS</option>
                <option>CHOWMEIN</option>
                <option>DESI CUSINE</option>
                <option>CHINESE</option>
            </select>
            <br><br>
            <button>Submit</button>

        </fieldset>
    </form>
    <hr>
